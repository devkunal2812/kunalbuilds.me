<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1F5F9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="60" font-family="Arial" font-size="32" font-weight="bold" fill="#0F172A" text-anchor="middle">E-Commerce Product Page</text>
  
  <!-- Product Image Section -->
  <rect x="80" y="120" width="500" height="600" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="110" y="150" width="440" height="440" rx="16" fill="#F8FAFC"/>
  <text x="330" y="390" font-family="Arial" font-size="120" text-anchor="middle">👟</text>
  
  <!-- Thumbnail Images -->
  <rect x="110" y="620" width="100" height="80" rx="12" fill="#E0E7FF" stroke="#3B82F6" stroke-width="3"/>
  <text x="160" y="670" font-family="Arial" font-size="32" text-anchor="middle">👟</text>
  
  <rect x="220" y="620" width="100" height="80" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="270" y="670" font-family="Arial" font-size="32" text-anchor="middle">👟</text>
  
  <rect x="330" y="620" width="100" height="80" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="380" y="670" font-family="Arial" font-size="32" text-anchor="middle">👟</text>
  
  <rect x="440" y="620" width="100" height="80" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="490" y="670" font-family="Arial" font-size="32" text-anchor="middle">👟</text>
  
  <!-- Product Details Section -->
  <rect x="620" y="120" width="500" height="600" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Badge -->
  <rect x="650" y="150" width="100" height="36" rx="18" fill="#10B981"/>
  <text x="700" y="173" font-family="Arial" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">New Arrival</text>
  
  <!-- Product Title -->
  <text x="650" y="220" font-family="Arial" font-size="32" font-weight="bold" fill="#0F172A">Air Max Pro</text>
  <text x="650" y="250" font-family="Arial" font-size="18" fill="#64748B">Premium Running Shoes</text>
  
  <!-- Rating -->
  <text x="650" y="290" font-family="Arial" font-size="20">⭐⭐⭐⭐⭐</text>
  <text x="780" y="290" font-family="Arial" font-size="16" fill="#64748B">(4.8) 2,847 reviews</text>
  
  <!-- Price -->
  <text x="650" y="340" font-family="Arial" font-size="42" font-weight="bold" fill="#0F172A">$129.99</text>
  <text x="800" y="340" font-family="Arial" font-size="24" fill="#94A3B8" text-decoration="line-through">$199.99</text>
  <rect x="900" y="315" width="80" height="32" rx="16" fill="#FEE2E2"/>
  <text x="940" y="336" font-family="Arial" font-size="14" font-weight="600" fill="#DC2626" text-anchor="middle">-35%</text>
  
  <!-- Color Selection -->
  <text x="650" y="400" font-family="Arial" font-size="16" font-weight="600" fill="#0F172A">Color</text>
  <circle cx="680" cy="430" r="24" fill="#3B82F6" stroke="#1E40AF" stroke-width="3"/>
  <circle cx="740" cy="430" r="24" fill="#EF4444" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="800" cy="430" r="24" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="860" cy="430" r="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Size Selection -->
  <text x="650" y="490" font-family="Arial" font-size="16" font-weight="600" fill="#0F172A">Size</text>
  <rect x="650" y="505" width="70" height="50" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <text x="685" y="537" font-family="Arial" font-size="16" fill="#64748B" text-anchor="middle">7</text>
  
  <rect x="730" y="505" width="70" height="50" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <text x="765" y="537" font-family="Arial" font-size="16" fill="#64748B" text-anchor="middle">8</text>
  
  <rect x="810" y="505" width="70" height="50" rx="12" fill="#3B82F6" stroke="#1E40AF" stroke-width="3"/>
  <text x="845" y="537" font-family="Arial" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">9</text>
  
  <rect x="890" y="505" width="70" height="50" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <text x="925" y="537" font-family="Arial" font-size="16" fill="#64748B" text-anchor="middle">10</text>
  
  <rect x="970" y="505" width="70" height="50" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <text x="1005" y="537" font-family="Arial" font-size="16" fill="#64748B" text-anchor="middle">11</text>
  
  <!-- Quantity -->
  <text x="650" y="605" font-family="Arial" font-size="16" font-weight="600" fill="#0F172A">Quantity</text>
  <rect x="650" y="620" width="140" height="50" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <text x="670" y="652" font-family="Arial" font-size="24" fill="#64748B">-</text>
  <text x="720" y="652" font-family="Arial" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">1</text>
  <text x="770" y="652" font-family="Arial" font-size="24" fill="#64748B">+</text>
  
  <!-- Buttons -->
  <rect x="650" y="620" width="390" height="60" rx="16" fill="#3B82F6"/>
  <text x="845" y="657" font-family="Arial" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Add to Cart 🛒</text>
  
  <rect x="810" y="620" width="230" height="60" rx="16" stroke="#0F172A" stroke-width="2" fill="none"/>
  <text x="925" y="657" font-family="Arial" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">❤️ Wishlist</text>
</svg>
