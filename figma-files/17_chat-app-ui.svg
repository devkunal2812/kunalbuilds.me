<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0F172A"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Chat Application UI</text>
  
  <!-- Sidebar -->
  <rect x="60" y="100" width="320" height="650" rx="20" fill="#1E293B"/>
  <rect x="60" y="100" width="320" height="650" rx="20" stroke="#334155" stroke-width="2" fill="none"/>
  
  <!-- Search -->
  <rect x="90" y="130" width="260" height="50" rx="25" fill="#0F172A"/>
  <text x="120" y="161" font-family="Arial" font-size="16" fill="#64748B">🔍 Search messages...</text>
  
  <!-- Chat List -->
  <rect x="90" y="200" width="260" height="80" rx="16" fill="#334155"/>
  <circle cx="125" cy="240" r="28" fill="#3B82F6"/>
  <text x="125" y="248" font-family="Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">JD</text>
  <text x="165" y="232" font-family="Arial" font-size="15" font-weight="600" fill="#F8FAFC">John Doe</text>
  <text x="165" y="252" font-family="Arial" font-size="13" fill="#94A3B8">Hey! How are you? 👋</text>
  <text x="320" y="215" font-family="Arial" font-size="11" fill="#64748B">2m</text>
  <circle cx="335" cy="240" r="10" fill="#EF4444"/>
  <text x="335" y="244" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  
  <rect x="90" y="295" width="260" height="80" rx="16" fill="#1E293B"/>
  <circle cx="125" cy="335" r="28" fill="#10B981"/>
  <text x="125" y="343" font-family="Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SM</text>
  <text x="165" y="327" font-family="Arial" font-size="15" font-weight="600" fill="#F8FAFC">Sarah Miller</text>
  <text x="165" y="347" font-family="Arial" font-size="13" fill="#94A3B8">See you tomorrow! 😊</text>
  <text x="320" y="310" font-family="Arial" font-size="11" fill="#64748B">1h</text>
  
  <rect x="90" y="390" width="260" height="80" rx="16" fill="#1E293B"/>
  <circle cx="125" cy="430" r="28" fill="#F59E0B"/>
  <text x="125" y="438" font-family="Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MJ</text>
  <text x="165" y="422" font-family="Arial" font-size="15" font-weight="600" fill="#F8FAFC">Mike Johnson</text>
  <text x="165" y="442" font-family="Arial" font-size="13" fill="#94A3B8">Thanks for the help! 🙏</text>
  <text x="320" y="405" font-family="Arial" font-size="11" fill="#64748B">3h</text>
  
  <rect x="90" y="485" width="260" height="80" rx="16" fill="#1E293B"/>
  <circle cx="125" cy="525" r="28" fill="#8B5CF6"/>
  <text x="125" y="533" font-family="Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EW</text>
  <text x="165" y="517" font-family="Arial" font-size="15" font-weight="600" fill="#F8FAFC">Emily White</text>
  <text x="165" y="537" font-family="Arial" font-size="13" fill="#94A3B8">Meeting at 3pm ⏰</text>
  <text x="320" y="500" font-family="Arial" font-size="11" fill="#64748B">5h</text>
  
  <!-- Main Chat Area -->
  <rect x="420" y="100" width="720" height="650" rx="20" fill="#1E293B"/>
  <rect x="420" y="100" width="720" height="650" rx="20" stroke="#334155" stroke-width="2" fill="none"/>
  
  <!-- Chat Header -->
  <rect x="420" y="100" width="720" height="80" rx="20" fill="#334155"/>
  <circle cx="470" cy="140" r="28" fill="#3B82F6"/>
  <text x="470" y="148" font-family="Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">JD</text>
  <text x="510" y="135" font-family="Arial" font-size="18" font-weight="600" fill="#F8FAFC">John Doe</text>
  <text x="510" y="155" font-family="Arial" font-size="13" fill="#10B981">● Online</text>
  
  <!-- Icons -->
  <text x="1050" y="145" font-family="Arial" font-size="24" fill="#94A3B8">📞</text>
  <text x="1090" y="145" font-family="Arial" font-size="24" fill="#94A3B8">🎥</text>
  
  <!-- Messages -->
  <rect x="460" y="220" width="400" height="80" rx="16" fill="#334155"/>
  <text x="480" y="245" font-family="Arial" font-size="15" fill="#F8FAFC">Hey! How are you doing?</text>
  <text x="480" y="270" font-family="Arial" font-size="15" fill="#F8FAFC">I wanted to ask about the project 🚀</text>
  <text x="480" y="290" font-family="Arial" font-size="11" fill="#64748B">10:30 AM</text>
  
  <rect x="880" y="330" width="240" height="60" rx="16" fill="#3B82F6"/>
  <text x="900" y="355" font-family="Arial" font-size="15" fill="#FFFFFF">I'm doing great! 😊</text>
  <text x="900" y="375" font-family="Arial" font-size="15" fill="#FFFFFF">What do you need?</text>
  <text x="1100" y="385" font-family="Arial" font-size="11" fill="#BFDBFE" text-anchor="end">10:32 AM</text>
  
  <rect x="460" y="420" width="350" height="60" rx="16" fill="#334155"/>
  <text x="480" y="445" font-family="Arial" font-size="15" fill="#F8FAFC">Can you review the design files?</text>
  <text x="480" y="465" font-family="Arial" font-size="15" fill="#F8FAFC">I sent them yesterday 📎</text>
  <text x="480" y="485" font-family="Arial" font-size="11" fill="#64748B">10:33 AM</text>
  
  <rect x="880" y="510" width="240" height="40" rx="16" fill="#3B82F6"/>
  <text x="900" y="535" font-family="Arial" font-size="15" fill="#FFFFFF">Sure! I'll check now ✓</text>
  <text x="1100" y="545" font-family="Arial" font-size="11" fill="#BFDBFE" text-anchor="end">10:35 AM</text>
  
  <!-- Typing Indicator -->
  <rect x="460" y="580" width="120" height="40" rx="16" fill="#334155"/>
  <circle cx="490" cy="600" r="5" fill="#94A3B8"/>
  <circle cx="520" cy="600" r="5" fill="#94A3B8"/>
  <circle cx="550" cy="600" r="5" fill="#94A3B8"/>
  
  <!-- Input Area -->
  <rect x="460" y="670" width="620" height="60" rx="16" fill="#0F172A"/>
  <text x="490" y="707" font-family="Arial" font-size="16" fill="#64748B">Type a message... 💬</text>
  <text x="1000" y="707" font-family="Arial" font-size="20" fill="#94A3B8">📎</text>
  <text x="1040" y="707" font-family="Arial" font-size="20" fill="#94A3B8">😊</text>
  <circle cx="1095" cy="700" r="20" fill="#3B82F6"/>
  <text x="1095" y="708" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">➤</text>
</svg>
