<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="particleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- K Letter -->
  <g filter="url(#glow)">
    <!-- Vertical spine -->
    <line x1="180" y1="150" x2="180" y2="362" 
          stroke="#ffffff" stroke-width="38" stroke-linecap="round"/>
    
    <!-- Upper arm -->
    <line x1="195" y1="250" x2="360" y2="155" 
          stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Lower arm -->
    <line x1="195" y1="265" x2="365" y2="360" 
          stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
  </g>
  
  <!-- Particle spray effect on left side -->
  <g opacity="0.8" filter="url(#particleGlow)">
    <circle cx="140" cy="200" r="2.5" fill="#ffffff"/>
    <circle cx="135" cy="215" r="2" fill="#ffffff"/>
    <circle cx="145" cy="185" r="1.8" fill="#ffffff"/>
    <circle cx="130" cy="230" r="2.2" fill="#ffffff"/>
    <circle cx="125" cy="245" r="1.5" fill="#ffffff"/>
    <circle cx="150" cy="170" r="2" fill="#ffffff"/>
    <circle cx="120" cy="260" r="1.8" fill="#ffffff"/>
    <circle cx="155" cy="160" r="1.5" fill="#ffffff"/>
    <circle cx="115" cy="275" r="2" fill="#ffffff"/>
    <circle cx="160" cy="150" r="1.3" fill="#ffffff"/>
    <circle cx="110" cy="290" r="1.5" fill="#ffffff"/>
    <circle cx="165" cy="145" r="1.2" fill="#ffffff"/>
    <circle cx="105" cy="305" r="1.3" fill="#ffffff"/>
    <circle cx="100" cy="320" r="1" fill="#ffffff"/>
    <circle cx="128" cy="195" r="1.8" fill="#ffffff"/>
    <circle cx="138" cy="235" r="1.6" fill="#ffffff"/>
    <circle cx="148" cy="175" r="1.4" fill="#ffffff"/>
    <circle cx="118" cy="250" r="1.7" fill="#ffffff"/>
    <circle cx="158" cy="155" r="1.2" fill="#ffffff"/>
    <circle cx="108" cy="285" r="1.4" fill="#ffffff"/>
  </g>
  
  <!-- KUNAL text -->
  <text x="256" y="440" text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', 'Consolas', monospace"
        font-size="48" font-weight="300" letter-spacing="12"
        fill="#ffffff" opacity="0.9">KUNAL</text>
</svg>
