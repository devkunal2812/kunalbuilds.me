<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Main gradient for background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for K letter -->
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" filter="url(#innerShadow)"/>
  
  <!-- Outer ring for premium look -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#kGrad)" stroke-width="2" opacity="0.4"/>
  
  <!-- Inner glow circle -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  
  <!-- K Letter - Modern geometric style -->
  <g filter="url(#glow)">
    <!-- Vertical stem of K -->
    <rect x="38" y="35" width="12" height="58" rx="2" fill="url(#kGrad)"/>
    
    <!-- Upper diagonal of K -->
    <path d="M 50 58 L 85 35 L 90 40 L 55 63 Z" fill="url(#kGrad)"/>
    
    <!-- Lower diagonal of K -->
    <path d="M 55 65 L 90 93 L 85 98 L 50 70 Z" fill="url(#kGrad)"/>
    
    <!-- Highlight on vertical stem -->
    <rect x="40" y="37" width="4" height="20" rx="1" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Accent dots for tech feel -->
  <circle cx="64" cy="20" r="2" fill="#60a5fa" opacity="0.6"/>
  <circle cx="64" cy="108" r="2" fill="#60a5fa" opacity="0.6"/>
  <circle cx="20" cy="64" r="2" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="108" cy="64" r="2" fill="#8b5cf6" opacity="0.6"/>
  
  <!-- Subtle shine effect -->
  <ellipse cx="50" cy="40" rx="25" ry="30" fill="url(#kGrad)" opacity="0.1" transform="rotate(-30 50 40)"/>
</svg>
