<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Dark mode gradient for background -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for K letter in dark mode -->
    <linearGradient id="kGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glowDark">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with dark gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradDark)"/>
  
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#kGradDark)" stroke-width="2" opacity="0.5"/>
  
  <!-- Inner glow circle -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
  
  <!-- K Letter with stronger glow for dark mode -->
  <g filter="url(#glowDark)">
    <!-- Vertical stem of K -->
    <rect x="38" y="35" width="12" height="58" rx="2" fill="url(#kGradDark)"/>
    
    <!-- Upper diagonal of K -->
    <path d="M 50 58 L 85 35 L 90 40 L 55 63 Z" fill="url(#kGradDark)"/>
    
    <!-- Lower diagonal of K -->
    <path d="M 55 65 L 90 93 L 85 98 L 50 70 Z" fill="url(#kGradDark)"/>
    
    <!-- Highlight on vertical stem -->
    <rect x="40" y="37" width="4" height="20" rx="1" fill="#93c5fd" opacity="0.5"/>
  </g>
  
  <!-- Accent dots -->
  <circle cx="64" cy="20" r="2" fill="#60a5fa" opacity="0.8"/>
  <circle cx="64" cy="108" r="2" fill="#60a5fa" opacity="0.8"/>
  <circle cx="20" cy="64" r="2" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="108" cy="64" r="2" fill="#8b5cf6" opacity="0.8"/>
  
  <!-- Subtle shine effect -->
  <ellipse cx="50" cy="40" rx="25" ry="30" fill="#60a5fa" opacity="0.15" transform="rotate(-30 50 40)"/>
</svg>
