<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Analytics Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-label {
      font-size: 0.9rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: #667eea;
    }

    .data-section {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    .data-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f8f9fa;
      font-weight: 600;
      color: #667eea;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background: #f8f9fa;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge-mobile { background: #e3f2fd; color: #1976d2; }
    .badge-tablet { background: #f3e5f5; color: #7b1fa2; }
    .badge-desktop { background: #e8f5e9; color: #388e3c; }
    .badge-visit { background: #fff3e0; color: #f57c00; }
    .badge-duration { background: #e0f2f1; color: #00796b; }

    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 1.2rem;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }

    .refresh-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.3s ease;
    }

    .refresh-btn:hover {
      background: #5568d3;
    }

    .chart-container {
      margin: 20px 0;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .bar {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }

    .bar-label {
      width: 150px;
      font-weight: 600;
      color: #333;
    }

    .bar-fill {
      height: 30px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      color: white;
      font-weight: bold;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Portfolio Analytics Dashboard</h1>
    
    <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>

    <div id="loading" class="loading">Loading analytics data...</div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="stats" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Visits</div>
          <div class="stat-value" id="totalVisits">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Unique Visitors</div>
          <div class="stat-value" id="uniqueVisitors">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg. Duration</div>
          <div class="stat-value" id="avgDuration">0s</div>
        </div>
      </div>

      <div class="data-section">
        <h2>📱 Device Breakdown</h2>
        <div id="deviceChart" class="chart-container"></div>
      </div>

      <div class="data-section">
        <h2>📄 Top Pages</h2>
        <div id="pagesChart" class="chart-container"></div>
      </div>

      <div class="data-section">
        <h2>🕐 Recent Visits</h2>
        <table id="recentTable">
          <thead>
            <tr>
              <th>Time</th>
              <th>Page</th>
              <th>Device</th>
              <th>Browser</th>
              <th>OS</th>
              <th>Duration</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Change this to your deployed URL or use relative path
    const API_BASE = window.location.origin + '/api/analytics';

    async function loadData() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const stats = document.getElementById('stats');

      loading.style.display = 'block';
      error.style.display = 'none';
      stats.style.display = 'none';

      try {
        // Fetch basic stats
        const statsRes = await fetch(API_BASE);
        const statsData = await statsRes.json();

        if (!statsData.success) {
          throw new Error('Failed to fetch stats');
        }

        // Display stats
        document.getElementById('totalVisits').textContent = statsData.stats.totalVisits || 0;
        document.getElementById('uniqueVisitors').textContent = statsData.stats.uniqueVisitors || 0;

        // Fetch recent visits (you'll need to add this endpoint)
        // For now, we'll show what we have
        
        loading.style.display = 'none';
        stats.style.display = 'block';

        // Show message if no data
        if (statsData.stats.totalVisits === 0) {
          error.textContent = 'No analytics data yet. Visit your portfolio to generate data!';
          error.style.display = 'block';
          error.style.background = '#fff3e0';
          error.style.color = '#f57c00';
        }

      } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.textContent = `Error loading data: ${err.message}. Make sure your backend is deployed and MONGODB_URI is set in Vercel environment variables.`;
        console.error('Error:', err);
      }
    }

    // Load data on page load
    loadData();
  </script>
</body>
</html>
